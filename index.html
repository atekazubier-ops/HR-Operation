<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام إدارة الموارد البشرية | HR System</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        /* --- 1. إعداد الألوان (رمادي، أبيض، برتقالي) --- */
        :root {
            --hr-orange: #ff6b4a;      /* اللون البرتقالي الأساسي */
            --hr-dark-grey: #2d3436;   /* رمادي غامق للنصوص والقائمة */
            --hr-light-grey: #f1f2f6;  /* رمادي فاتح للخلفية */
            --hr-white: #ffffff;       /* أبيض للبطاقات */
            --hr-border: #dfe6e9;     /* لون الحدود */
        }

        body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            margin: 0;
            display: flex;
            height: 100vh;
            background-color: var(--hr-light-grey);
        }

        /* --- 2. القائمة الجانبية (Sidebar) --- */
        .sidebar {
            width: 260px;
            background-color: var(--hr-dark-grey);
            color: white;
            display: flex;
            flex-direction: column;
            padding: 20px 0;
        }

        .sidebar-header {
            text-align: center;
            padding-bottom: 20px;
            border-bottom: 1px solid #444;
            margin-bottom: 20px;
        }

        .sidebar-header h2 {
            color: var(--hr-orange);
            font-size: 22px;
            margin: 0;
        }

        .nav-link {
            padding: 15px 25px;
            color: #bdc3c7;
            text-decoration: none;
            display: flex;
            align-items: center;
            transition: 0.3s;
        }

        .nav-link:hover, .nav-link.active {
            background-color: #3d454d;
            color: var(--hr-orange);
            border-right: 4px solid var(--hr-orange);
        }

        .nav-link i { margin-left: 15px; font-size: 18px; }

        /* --- 3. المحتوى الرئيسي --- */
        .main-content {
            flex: 1;
            padding: 30px;
            overflow-y: auto;
        }

        /* --- 4. بطاقات ملخص الـ HR --- */
        .hr-stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: var(--hr-white);
            padding: 20px;
            border-radius: 12px;
            border-bottom: 4px solid var(--hr-orange); /* خط برتقالي أسفل البطاقة */
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }

        .stat-card h4 { margin: 0; color: var(--hr-dark-grey); opacity: 0.7; font-size: 14px; }
        .stat-card .num { font-size: 28px; font-weight: bold; color: var(--hr-dark-grey); margin: 10px 0; }

        /* --- 5. نموذج إضافة الموظف والجدول --- */
        .employee-section {
            background: var(--hr-white);
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }

        .form-row {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        input {
            padding: 12px;
            border: 1px solid var(--hr-border);
            border-radius: 6px;
            flex: 1;
            min-width: 200px;
        }

        button {
            background-color: var(--hr-orange);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        table th { background: var(--hr-light-grey); padding: 15px; text-align: right; font-size: 14px; }
        table td { padding: 15px; border-bottom: 1px solid var(--hr-border); font-size: 14px; }

    </style>
</head>
<body>

    <div class="sidebar">
        <div class="sidebar-header">
            <h2>نظام HR الذكي</h2>
        </div>
        <a href="#" class="nav-link active"><i class="fas fa-users"></i> دليل الموظفين</a>
        <a href="#" class="nav-link"><i class="fas fa-user-plus"></i> التوظيف</a>
        <a href="#" class="nav-link"><i class="fas fa-money-check-alt"></i> الرواتب</a>
        <a href="#" class="nav-link"><i class="fas fa-calendar-check"></i> الحضور والانصراف</a>
        <a href="#" class="nav-link"><i class="fas fa-file-invoice"></i> التقارير</a>
    </div>

    <div class="main-content">
        <header style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px;">
            <h2 style="margin: 0;">لوحة إدارة الموظفين</h2>
            <span id="date-display" style="color: var(--hr-dark-grey); opacity: 0.6;"></span>
        </header>

        <div class="hr-stats">
            <div class="stat-card">
                <h4>إجمالي الموظفين</h4>
                <div class="num" id="empCount">0</div>
            </div>
            <div class="stat-card">
                <h4>الموظفين النشطين</h4>
                <div class="num">12</div>
            </div>
            <div class="stat-card">
                <h4>طلبات الإجازة</h4>
                <div class="num" style="color: var(--hr-orange);">3</div>
            </div>
        </div>

        <div class="employee-section">
            <h3 style="margin-top: 0;">إضافة موظف جديد</h3>
            <div class="form-row">
                <input type="text" id="empName" placeholder="اسم الموظف الكامل">
                <input type="text" id="empRole" placeholder="المسمى الوظيفي (مثلاً: محاسب)">
                <button id="saveEmp">إضافة للمؤسسة</button>
            </div>

            <table>
                <thead>
                    <tr>
                        <th>الاسم</th>
                        <th>الوظيفة</th>
                        <th>تاريخ التعيين</th>
                        <th>الحالة</th>
                    </tr>
                </thead>
                <tbody id="empTableBody">
                    </tbody>
            </table>
        </div>
    </div>

    <script type="module">
        // استيراد Firebase (نفس الإعدادات السابقة)
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, query, orderBy } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCy5VroP_MGxOXUHxN0KJLStmGE_iV0UFY",
            authDomain: "test-81dcc.firebaseapp.com",
            projectId: "test-81dcc",
            storageBucket: "test-81dcc.firebasestorage.app",
            messagingSenderId: "462100667219",
            appId: "1:462100667219:web:1cc7819a81799e3022dfa6",
            measurementId: "G-2M9HZYTYTN"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // العناصر
        const empName = document.getElementById('empName');
        const empRole = document.getElementById('empRole');
        const saveBtn = document.getElementById('saveEmp');
        const empTable = document.getElementById('empTableBody');
        const empCount = document.getElementById('empCount');

        // إضافة موظف لـ Firebase
        saveBtn.onclick = async () => {
            if(empName.value && empRole.value) {
                await addDoc(collection(db, "employees"), {
                    name: empName.value,
                    role: empRole.value,
                    joinDate: new Date()
                });
                empName.value = ""; empRole.value = "";
            }
        };

        // تحديث الجدول المباشر
        const q = query(collection(db, "employees"), orderBy("joinDate", "desc"));
        onSnapshot(q, (snapshot) => {
            empTable.innerHTML = "";
            empCount.innerText = snapshot.size;
            snapshot.forEach((doc) => {
                const emp = doc.data();
                empTable.innerHTML += `
                    <tr>
                        <td><b>${emp.name}</b></td>
                        <td>${emp.role}</td>
                        <td>${emp.joinDate.toDate().toLocaleDateString()}</td>
                        <td><span style="color: #0acf97; background: #e6fff7; padding: 4px 8px; border-radius: 4px; font-size: 12px;">موظف نشط</span></td>
                    </tr>
                `;
            });
        });

        // عرض التاريخ الحالي
        document.getElementById('date-display').innerText = new Date().toLocaleDateString('ar-EG', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
    </script>
</body>
</html>
