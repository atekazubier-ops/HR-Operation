<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-database-compat.js"></script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام HR المتكامل - الإصدار 17.3 (المشاركة السحابية)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #2563eb; --secondary: #64748b; --accent: #facc15; --bg-main: #f8fafc; }
        body { font-family: 'Cairo', sans-serif; background-color: var(--bg-main); color: #1e293b; }
        .sidebar-link { transition: all 0.3s ease; }
        .sidebar-link.active { background: linear-gradient(90deg, #1e40af 0%, #2563eb 100%); border-left: 4px solid var(--accent); }
        .glass { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        .status-badge { padding: 2px 8px; border-radius: 12px; font-size: 0.75rem; font-weight: bold; }
    </style>
</head>
<body class="flex flex-col md:flex-row min-h-screen">

    <!-- Sidebar -->
    <aside class="w-full md:w-64 bg-slate-900 text-white flex-shrink-0 flex flex-col shadow-2xl z-50">
        <div class="p-6 border-b border-slate-800">
            <h1 class="text-2xl font-extrabold text-blue-400 tracking-tight">HR SYSTEM</h1>
            <p class="text-[10px] text-slate-400 mt-1 uppercase tracking-widest font-bold">Version 17.3 Cloud</p>
        </div>
        <nav class="flex-grow p-4 space-y-2 overflow-y-auto custom-scrollbar">
            <button onclick="showSection('dashboard')" id="btn-dashboard" class="sidebar-link w-full flex items-center gap-3 p-3 rounded-xl hover:bg-slate-800 active">📊 لوحة التحكم</button>
            <button onclick="showSection('employees')" id="btn-employees" class="sidebar-link w-full flex items-center gap-3 p-3 rounded-xl hover:bg-slate-800">👥 شؤون الموظفين</button>
            <button onclick="showSection('tasks')" id="btn-tasks" class="sidebar-link w-full flex items-center gap-3 p-3 rounded-xl hover:bg-slate-800">📋 المهام</button>
            <button onclick="showSection('leaves')" id="btn-leaves" class="sidebar-link w-full flex items-center gap-3 p-3 rounded-xl hover:bg-slate-800">🏖️ الإجازات</button>
        </nav>
    </aside>

    <!-- Main Content -->
    <main class="flex-grow flex flex-col min-h-screen overflow-hidden">
        <header class="h-16 bg-white border-b flex items-center justify-between px-6 shadow-sm z-40">
            <h2 id="section-title" class="text-xl font-bold text-slate-800">لوحة التحكم</h2>
            <div class="flex items-center gap-4">
                <div class="text-left">
                    <p id="cloud-status" class="text-[10px] text-green-500 font-bold">● متصل بالسحابة</p>
                    <p id="current-date" class="text-xs text-slate-500 font-medium"></p>
                </div>
            </div>
        </header>

        <section id="content-area" class="p-6 overflow-y-auto flex-grow">
            
            <!-- لوحة التحكم -->
            <div id="section-dashboard" class="space-y-6">
                <div class="grid grid-cols-1 md:grid-cols-4 gap-6">
                    <div class="glass p-6 rounded-2xl shadow-sm border border-slate-100 flex flex-col items-center justify-center">
                        <span class="text-blue-500 bg-blue-50 p-3 rounded-full mb-3 italic">👥</span>
                        <p class="text-xs text-slate-500 font-bold">إجمالي الموظفين</p>
                        <h3 id="stat-emp-count" class="text-3xl font-black text-slate-800 mt-1">0</h3>
                    </div>
                    <div class="glass p-6 rounded-2xl shadow-sm border border-slate-100 flex flex-col items-center justify-center">
                        <span class="text-orange-500 bg-orange-50 p-3 rounded-full mb-3 italic">📋</span>
                        <p class="text-xs text-slate-500 font-bold">مهام قيد التنفيذ</p>
                        <h3 id="stat-task-count" class="text-3xl font-black text-slate-800 mt-1">0</h3>
                    </div>
                    <div class="glass p-6 rounded-2xl shadow-sm border border-slate-100 flex flex-col items-center justify-center">
                        <span class="text-green-500 bg-green-50 p-3 rounded-full mb-3 italic">🏖️</span>
                        <p class="text-xs text-slate-500 font-bold">إجازات نشطة</p>
                        <h3 id="stat-leave-count" class="text-3xl font-black text-slate-800 mt-1">0</h3>
                    </div>
                    <div class="glass p-6 rounded-2xl shadow-sm border border-slate-100 flex flex-col items-center justify-center">
                        <span class="text-red-500 bg-red-50 p-3 rounded-full mb-3 italic">⚠️</span>
                        <p class="text-xs text-slate-500 font-bold">تنبيهات/خصومات</p>
                        <h3 id="stat-action-count" class="text-3xl font-black text-slate-800 mt-1">0</h3>
                    </div>
                </div>
                
                <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100">
                    <h4 class="font-bold mb-4 flex items-center gap-2">🚀 أحدث المهام</h4>
                    <div id="recent-tasks-list" class="space-y-3">
                        <p class="text-sm text-slate-400 italic">لا توجد مهام حالياً...</p>
                    </div>
                </div>
            </div>

            <!-- قسم الموظفين -->
            <div id="section-employees" class="hidden space-y-6">
                <div class="flex flex-col md:flex-row gap-4 justify-between items-center bg-white p-4 rounded-2xl shadow-sm">
                    <input type="text" id="empSearch" oninput="renderEmployees()" placeholder="بحث بالاسم أو القسم..." class="w-full md:w-80 p-2 bg-slate-50 border rounded-xl outline-none focus:ring-2 focus:ring-blue-500 text-sm">
                    <button onclick="openModal('addEmpModal')" class="bg-blue-600 text-white px-6 py-2 rounded-xl font-bold hover:bg-blue-700 transition shadow-lg shadow-blue-200">إضافة موظف جديد +</button>
                </div>
                <div class="bg-white rounded-2xl shadow-sm border border-slate-100 overflow-hidden">
                    <table class="w-full text-right">
                        <thead class="bg-slate-50 text-slate-500 text-[10px] uppercase font-bold border-b">
                            <tr>
                                <th class="p-4">الموظف</th>
                                <th class="p-4">القسم والمنصب</th>
                                <th class="p-4">الحالة</th>
                                <th class="p-4">الإجراءات</th>
                            </tr>
                        </thead>
                        <tbody id="empTableBody" class="divide-y divide-slate-50"></tbody>
                    </table>
                </div>
            </div>

            <!-- قسم المهام -->
            <div id="section-tasks" class="hidden space-y-6">
                 <div class="flex justify-between items-center">
                    <h3 class="font-bold text-slate-800">سجل المهام العام</h3>
                    <div class="flex gap-2">
                        <select id="taskFilter" onchange="renderTasks()" class="p-2 border rounded-lg text-sm bg-white">
                            <option value="all">الكل</option>
                            <option value="pending">قيد الانتظار</option>
                            <option value="completed">مكتملة</option>
                        </select>
                    </div>
                 </div>
                 <div id="tasksContainer" class="grid grid-cols-1 md:grid-cols-3 gap-4 font-cairo"></div>
            </div>

            <!-- قسم الإجازات -->
            <div id="section-leaves" class="hidden space-y-6">
                <div class="bg-white p-6 rounded-2xl shadow-sm overflow-x-auto">
                    <table class="w-full text-right">
                        <thead>
                            <tr class="text-slate-400 text-sm border-b">
                                <th class="p-3">الموظف</th>
                                <th class="p-3">نوع الإجازة</th>
                                <th class="p-3">من - إلى</th>
                                <th class="p-3">المدة</th>
                            </tr>
                        </thead>
                        <tbody id="leavesTableBody"></tbody>
                    </table>
                </div>
            </div>

        </section>
    </main>

    <!-- Modal: إضافة موظف -->
    <div id="addEmpModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm hidden z-[100] flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-2xl rounded-3xl shadow-2xl overflow-hidden animate-in fade-in zoom-in duration-200">
            <div class="p-6 bg-blue-600 text-white flex justify-between items-center">
                <h3 class="text-xl font-bold italic">بطاقة موظف جديدة</h3>
                <button onclick="closeModal('addEmpModal')" class="text-3xl hover:rotate-90 transition-transform">&times;</button>
            </div>
            <form id="addEmpForm" onsubmit="saveEmployee(event)" class="p-6 grid grid-cols-1 md:grid-cols-2 gap-4">
                <input type="text" id="f_name" placeholder="الاسم الكامل" class="p-3 bg-slate-50 border rounded-xl outline-none" required>
                <input type="text" id="f_nat" placeholder="الجنسية" class="p-3 bg-slate-50 border rounded-xl outline-none" required>
                <input type="text" id="f_id" placeholder="رقم الهوية / الإقامة" class="p-3 bg-slate-50 border rounded-xl outline-none" required>
                <input type="text" id="f_phone" placeholder="رقم الجوال" class="p-3 bg-slate-50 border rounded-xl outline-none" required>
                <input type="text" id="f_dept" placeholder="القسم" class="p-3 bg-slate-50 border rounded-xl outline-none" required>
                <input type="text" id="f_pos" placeholder="المسمى الوظيفي" class="p-3 bg-slate-50 border rounded-xl outline-none" required>
                <input type="number" id="f_salary" placeholder="الراتب الأساسي" class="p-3 bg-slate-50 border rounded-xl outline-none" required>
                <input type="date" id="f_start_date" class="p-3 bg-slate-50 border rounded-xl outline-none" required>
                <button type="submit" class="md:col-span-2 bg-blue-600 text-white py-4 rounded-2xl font-black text-lg hover:bg-blue-700 shadow-xl shadow-blue-100 transition-all active:scale-95">حفظ وتزامن سحابي</button>
            </form>
        </div>
    </div>

    <!-- Modal: تفاصيل الموظف وإجراءات (مثل كودك) -->
    <div id="detailsModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm hidden z-[100] flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-4xl max-h-[90vh] rounded-3xl shadow-2xl overflow-y-auto custom-scrollbar p-6">
            <div id="detailsContent"></div>
            <div class="mt-6 flex justify-end">
                <button onclick="closeModal('detailsModal')" class="bg-slate-200 text-slate-800 px-6 py-2 rounded-xl font-bold">إغلاق</button>
            </div>
        </div>
    </div>

    <script>
        // --- تهيئة Firebase ببياناتك ---
        const firebaseConfig = {
            apiKey: "AIzaSyAAe-WjGh9PtL932wxJPgLSuaslmJWaDC8",
            authDomain: "hr-operation.firebaseapp.com",
            databaseURL: "https://hr-operation-default-rtdb.firebaseio.com",
            projectId: "hr-operation",
            storageBucket: "hr-operation.firebasestorage.app",
            messagingSenderId: "498775599728",
            appId: "1:498775599728:web:b195dea758f3cf415162b5",
            measurementId: "G-YQTYHQ40NN"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        let employees = [];

        // --- المزامنة ---
        function initSync() {
            db.ref('employees_v17').on('value', snapshot => {
                const val = snapshot.val();
                employees = val ? Object.entries(val).map(([id, data]) => ({ id, ...data })) : [];
                renderAll();
                document.getElementById('cloud-status').innerText = "● متصل بالسحابة (تم التحديث: " + new Date().toLocaleTimeString('ar-SA') + ")";
            });
            document.getElementById('current-date').innerText = new Date().toLocaleDateString('ar-SA', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
        }

        // --- وظائف العرض ---
        function showSection(sectionId) {
            ['dashboard', 'employees', 'tasks', 'leaves'].forEach(s => {
                document.getElementById('section-' + s).classList.add('hidden');
                document.getElementById('btn-' + s).classList.remove('active');
            });
            document.getElementById('section-' + sectionId).classList.remove('hidden');
            document.getElementById('btn-' + sectionId).classList.add('active');
            document.getElementById('section-title').innerText = event.currentTarget.innerText.split(' ')[1];
        }

        function openModal(id) { document.getElementById(id).classList.remove('hidden'); }
        function closeModal(id) { document.getElementById(id).classList.add('hidden'); }

        function saveEmployee(e) {
            e.preventDefault();
            const newEmp = {
                name: document.getElementById('f_name').value,
                nat: document.getElementById('f_nat').value,
                idCard: document.getElementById('f_id').value,
                phone: document.getElementById('f_phone').value,
                dept: document.getElementById('f_dept').value,
                pos: document.getElementById('f_pos').value,
                salary: document.getElementById('f_salary').value,
                startDate: document.getElementById('f_start_date').value,
                status: 'نشط',
                leaveBal: 30,
                actions: [],
                leaves: [],
                tasks: []
            };
            db.ref('employees_v17').push(newEmp).then(() => {
                closeModal('addEmpModal');
                e.target.reset();
            });
        }

        function renderAll() {
            renderEmployees();
            renderTasks();
            renderLeaves();
            updateStats();
        }

        function renderEmployees() {
            const query = document.getElementById('empSearch').value.toLowerCase();
            const tbody = document.getElementById('empTableBody');
            tbody.innerHTML = employees.filter(e => e.name.toLowerCase().includes(query) || e.dept.toLowerCase().includes(query))
                .map(emp => `
                    <tr class="group hover:bg-blue-50/50 transition-colors">
                        <td class="p-4">
                            <div class="font-bold text-slate-800">${emp.name}</div>
                            <div class="text-[10px] text-slate-400">ID: ${emp.idCard || '---'}</div>
                        </td>
                        <td class="p-4">
                            <div class="text-xs font-bold text-blue-600">${emp.dept}</div>
                            <div class="text-[10px] text-slate-500">${emp.pos}</div>
                        </td>
                        <td class="p-4"><span class="status-badge bg-green-100 text-green-700">${emp.status}</span></td>
                        <td class="p-4">
                            <div class="flex gap-2">
                                <button onclick="viewDetails('${emp.id}')" class="text-blue-500 text-xs font-bold hover:underline">الملف الكامل</button>
                                <button onclick="deleteEmp('${emp.id}')" class="text-red-300 hover:text-red-600 transition text-[10px]">حذف</button>
                            </div>
                        </td>
                    </tr>
                `).join('');
        }

        function viewDetails(id) {
            const emp = employees.find(e => e.id === id);
            const content = `
                <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                    <div class="md:col-span-1 bg-slate-50 p-6 rounded-2xl border border-slate-100">
                        <div class="w-24 h-24 bg-blue-100 rounded-3xl mx-auto mb-4 flex items-center justify-center text-3xl italic text-blue-500">USER</div>
                        <h4 class="text-center font-black text-xl text-slate-800">${emp.name}</h4>
                        <p class="text-center text-xs text-blue-600 font-bold mb-4">${emp.pos}</p>
                        <hr class="my-4">
                        <div class="space-y-2 text-sm">
                            <div class="flex justify-between"><span>القسم:</span><span class="font-bold">${emp.dept}</span></div>
                            <div class="flex justify-between"><span>الراتب:</span><span class="font-bold text-green-600">${emp.salary} ر.س</span></div>
                            <div class="flex justify-between"><span>رصيد الإجازات:</span><span class="font-bold text-orange-600">${emp.leaveBal} يوم</span></div>
                        </div>
                    </div>
                    <div class="md:col-span-2 space-y-6">
                        <div class="flex gap-2 overflow-x-auto pb-2 border-b">
                            <button class="bg-blue-600 text-white px-4 py-2 rounded-lg text-xs font-bold" onclick="alert('إضافة إجراء (مكافأة/خصم) قريباً')">+ إجراء</button>
                            <button class="bg-orange-500 text-white px-4 py-2 rounded-lg text-xs font-bold" onclick="alert('طلب إجازة قريباً')">+ إجازة</button>
                            <button class="bg-indigo-600 text-white px-4 py-2 rounded-lg text-xs font-bold" onclick="addTaskToEmp('${emp.id}')">+ مهمة</button>
                        </div>
                        <div>
                            <h5 class="font-bold mb-3 text-sm">📋 المهام الحالية</h5>
                            <div id="emp-tasks-list" class="space-y-2">
                                ${Object.values(emp.tasks || {}).map(t => `<div class="p-3 bg-slate-50 border rounded-xl text-xs flex justify-between"><span>${t.text}</span> <span class="text-blue-500">${t.status}</span></div>`).join('') || '<p class="text-xs text-slate-400 italic">لا توجد مهام...</p>'}
                            </div>
                        </div>
                    </div>
                </div>
            `;
            document.getElementById('detailsContent').innerHTML = content;
            openModal('detailsModal');
        }

        function addTaskToEmp(id) {
            const task = prompt("ادخل وصف المهمة الجديدة:");
            if(task) {
                db.ref(`employees_v17/${id}/tasks`).push({
                    text: task,
                    status: 'قيد الانتظار',
                    date: new Date().toISOString()
                });
            }
        }

        function deleteEmp(id) {
            if(confirm("هل تريد حذف هذا الموظف نهائياً من السحابة؟")) {
                db.ref(`employees_v17/${id}`).remove();
            }
        }

        function renderTasks() {
            const filter = document.getElementById('taskFilter').value;
            const container = document.getElementById('tasksContainer');
            let html = '';
            let allTasks = [];
            
            employees.forEach(emp => {
                if(emp.tasks) {
                    Object.entries(emp.tasks).forEach(([tid, t]) => {
                        if(filter === 'all' || (filter === 'pending' && t.status !== 'مكتملة') || (filter === 'completed' && t.status === 'مكتملة')) {
                            allTasks.push({ empName: emp.name, empId: emp.id, taskId: tid, ...t });
                        }
                    });
                }
            });

            container.innerHTML = allTasks.map(t => `
                <div class="bg-white p-4 rounded-2xl shadow-sm border-r-4 ${t.status === 'مكتملة' ? 'border-green-500' : 'border-orange-400'}">
                    <div class="flex justify-between items-start mb-2">
                        <span class="text-[10px] bg-slate-100 px-2 py-1 rounded-lg font-bold">${t.empName}</span>
                        <button onclick="toggleTask('${t.empId}', '${t.taskId}', '${t.status}')" class="text-[10px] text-blue-500 font-bold">${t.status === 'مكتملة' ? 'إعادة فتح' : 'إتمام'}</button>
                    </div>
                    <p class="text-sm font-bold text-slate-700">${t.text}</p>
                </div>
            `).join('');
            
            // تحديث لوحة التحكم
            const recent = allTasks.slice(-3).reverse().map(t => `
                <div class="flex justify-between items-center text-xs p-2 bg-slate-50 rounded-lg">
                    <span>${t.text}</span>
                    <span class="text-blue-500 font-bold">${t.empName}</span>
                </div>
            `).join('');
            document.getElementById('recent-tasks-list').innerHTML = recent || '<p class="text-xs text-slate-400 italic">لا توجد مهام...</p>';
        }

        function toggleTask(eid, tid, currentStatus) {
            const next = currentStatus === 'مكتملة' ? 'قيد الانتظار' : 'مكتملة';
            db.ref(`employees_v17/${eid}/tasks/${tid}`).update({ status: next });
        }

        function renderLeaves() {
            // محاكاة الإجازات من البيانات
            const tbody = document.getElementById('leavesTableBody');
            let html = '';
            employees.forEach(emp => {
                if(emp.leaves) {
                    emp.leaves.forEach(l => {
                        html += `<tr class="border-b"><td class="p-3 font-bold">${emp.name}</td><td class="p-3">${l.type}</td><td class="p-3 text-xs">${l.start} / ${l.end}</td><td class="p-3 text-blue-600 font-bold">${l.days} يوم</td></tr>`;
                    });
                }
            });
            tbody.innerHTML = html || '<tr><td colspan="4" class="p-6 text-center text-slate-400 italic">لا توجد إجازات حالياً</td></tr>';
        }

        function updateStats() {
            document.getElementById('stat-emp-count').innerText = employees.length;
            let pendingTasks = 0;
            let totalActions = 0;
            employees.forEach(emp => {
                if(emp.tasks) {
                    Object.values(emp.tasks).forEach(t => { if(t.status !== 'مكتملة') pendingTasks++; });
                }
                if(emp.actions) totalActions += emp.actions.length;
            });
            document.getElementById('stat-task-count').innerText = pendingTasks;
            document.getElementById('stat-action-count').innerText = totalActions;
        }

        // تشغيل النظام
        window.onload = initSync;
    </script>
</body>
</html>
