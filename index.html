<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HR System</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
body { font-family: 'Cairo', sans-serif; }
.hidden-section { display: none; }
.active { display: block; }
table, th, td { border-collapse: collapse; }
th, td { padding: 8px; border: 1px solid #ddd; }
</style>
</head>
<body>

<!-- ===== لوحة التحكم ===== -->
<section id="dashboard">
    <h2>لوحة التحكم</h2>
    <button onclick="showSection('employees')">قائمة الموظفين</button>
</section>

<!-- ===== الموظفين ===== -->
<section id="employees" class="hidden-section">
    <h2>الموظفين</h2>
    <input type="text" id="empSearch" placeholder="بحث..." oninput="searchEmployees()">
    <table>
        <thead>
            <tr><th>الاسم</th><th>القسم</th><th>عرض</th></tr>
        </thead>
        <tbody id="employeesTableBody"></tbody>
    </table>

    <!-- نموذج إضافة موظف -->
    <h3>إضافة موظف</h3>
    <form onsubmit="saveNewEmployee(event)">
        <input id="f_id" placeholder="الرقم الوظيفي" required>
        <input id="f_name" placeholder="الاسم" required>
        <input id="f_dept" placeholder="القسم" required>
        <input id="f_pos" placeholder="المسمى" required>
        <input id="f_salary" placeholder="الراتب">
        <input id="f_phone" placeholder="الهاتف">
        <input id="f_dob" placeholder="تاريخ الميلاد">
        <input id="f_blood" placeholder="فصيلة الدم">
        <input id="f_address" placeholder="العنوان">
        <input id="f_start_date" placeholder="بداية العمل" type="date">
        <input id="f_leave_bal" placeholder="رصيد الإجازات">
        <input id="f_nat" placeholder="الجنسية">
        <button type="submit">إضافة موظف</button>
    </form>

    <button onclick="downloadFullBackup()">تحميل نسخة احتياطية</button>
    <input type="file" onchange="importFullBackup(event)">
</section>

<!-- ===== مودال الإضافي ===== -->
<div id="modalOvertime" class="hidden-section">
    <h3>إضافة ساعات إضافية</h3>
    <span>متبقي: <span id="overtime_remaining_display"></span></span>
    <input type="date" id="overtime_date">
    <input type="number" id="overtime_hours" placeholder="عدد الساعات">
    <input type="text" id="overtime_reason" placeholder="السبب">
    <button onclick="saveOvertime()">حفظ</button>
    <button onclick="closeModal('modalOvertime')">إغلاق</button>
</div>

<!-- ===== مودال AI ===== -->
<div id="modalAI" class="hidden-section">
    <div id="aiResultContent"></div>
    <button onclick="closeModal('modalAI')">إغلاق</button>
</div>

<!-- ===== جدول الإضافي في البروفايل ===== -->
<table>
    <thead>
        <tr>
            <th>التاريخ</th><th>عدد الساعات</th><th>السبب</th><th>حذف</th>
        </tr>
    </thead>
    <tbody id="profileOvertimeTable"></tbody>
</table>
<div id="profile-overtime-stats"></div>

<!-- =====================
       JS العادي
===================== -->
<script>
let employees = [];
let currentEmpId = null;
let systemDate = new Date();
let apiKey = "";

// NAVIGATION
function showSection(id){
    document.querySelectorAll('section').forEach(s=>s.classList.add('hidden-section'));
    const sec = document.getElementById(id);
    if(sec) sec.classList.remove('hidden-section');
}

// MODALS
function openModal(id){ document.getElementById(id)?.classList.add('active'); }
function closeModal(id){ document.getElementById(id)?.classList.remove('active'); }

// STORAGE
function saveToStorage(){ localStorage.setItem("employees", JSON.stringify(employees)); }

// EMPLOYEES
function saveNewEmployee(e){
    e.preventDefault();
    const id=document.getElementById('f_id').value;
    if(employees.some(emp=>emp.id==id)) return alert("الرقم مسجل!");
    employees.push({
        id:id,
        name:document.getElementById('f_name').value,
        details:{
            "القسم":document.getElementById('f_dept').value,
            "المسمى":document.getElementById('f_pos').value,
            "الراتب":document.getElementById('f_salary').value,
            "الهاتف":document.getElementById('f_phone').value,
            "تاريخ الميلاد":document.getElementById('f_dob').value,
            "فصيلة الدم":document.getElementById('f_blood').value,
            "العنوان":document.getElementById('f_address').value,
            "بداية العمل":document.getElementById('f_start_date').value,
            "رصيد الإجازات":document.getElementById('f_leave_bal').value,
            "الجنسية":document.getElementById('f_nat').value
        },
        schedule:{}, actions:[], tasks:[], leaves:[], overtime:[]
    });
    saveToStorage();
    renderEmployeeList();
    showSection('dashboard');
}

function renderEmployeeList(data = employees){
    const tbody=document.getElementById('employeesTableBody');
    if(!tbody) return;
    tbody.innerHTML=data.map(emp=>`
        <tr>
            <td>${emp.name} #${emp.id}</td>
            <td>${emp.details['القسم']}</td>
            <td><button onclick="viewProfile('${emp.id}')">عرض</button></td>
        </tr>
    `).join('');
}

function searchEmployees(){
    const v=document.getElementById('empSearch')?.value.toLowerCase()||"";
    renderEmployeeList(employees.filter(e=>e.name.toLowerCase().includes(v)||e.id.toLowerCase().includes(v)));
}

// BACKUP
function downloadFullBackup(){
    const a=document.createElement("a");
    a.href=URL.createObjectURL(new Blob([JSON.stringify(employees)],{type:"application/json"}));
    a.download="HR_Backup.json"; a.click();
}

function importFullBackup(event){
    const file=event.target.files[0]; if(!file) return;
    const reader=new FileReader();
    reader.onload=function(e){
        try{
            const importedData=JSON.parse(e.target.result);
            if(Array.isArray(importedData)){
                if(confirm("استعادة النسخة الاحتياطية سيؤدي لمسح البيانات الحالية. هل أنت متأكد؟")){
                    employees=importedData;
                    saveToStorage();
                    window.location.reload();
                }
            } else alert("ملف غير صالح!");
        } catch(err){ alert("حدث خطأ!"); console.error(err); }
    };
    reader.readAsText(file);
}

// OVERTIME
function prepareOvertimeModal(){
    const emp=employees.find(e=>e.id==currentEmpId);
    if(!emp.overtime) emp.overtime=[];
    const usedHours=emp.overtime.reduce((sum,item)=>sum+parseFloat(item.hours),0);
    const remaining=20-usedHours;
    document.getElementById('overtime_remaining_display')?.innerText=remaining;
    document.getElementById('overtime_date').value=new Date().toISOString().split('T')[0];
    document.getElementById('overtime_hours').value="";
    if(remaining<=0) alert("لقد استنفذ هذا الموظف رصيد الإضافي بالكامل (20 ساعة).");
    openModal('modalOvertime');
}

function saveOvertime(){
    const emp=employees.find(e=>e.id==currentEmpId);
    if(!emp.overtime) emp.overtime=[];
    const date=document.getElementById('overtime_date').value;
    const hours=parseFloat(document.getElementById('overtime_hours').value);
    const reason=document.getElementById('overtime_reason').value;
    if(!date||!hours||hours<=0) return alert("يرجى إدخال بيانات صحيحة");
    const currentUsed=emp.overtime.reduce((sum,item)=>sum+parseFloat(item.hours),0);
    if(currentUsed+hours>20) return alert("الرصيد غير كافي!");
    emp.overtime.push({date,hours,reason});
    saveToStorage();
    renderOvertimeTable(emp);
    closeModal('modalOvertime');
}

function renderOvertimeTable(emp){
    const tbody=document.getElementById('profileOvertimeTable');
    const records=emp.overtime||[];
    const totalHours=records.reduce((sum,item)=>sum+parseFloat(item.hours),0);
    const remaining=20-totalHours;
    document.getElementById('profile-overtime-stats')?.innerText=`مستخدم: ${totalHours} | متبقي: ${remaining}`;
    tbody.innerHTML=records.map((item,index)=>`
        <tr>
            <td>${item.date}</td><td>${item.hours}</td><td>${item.reason}</td>
            <td><button onclick="deleteOvertime(${index})">✕</button></td>
        </tr>
    `).join('') || '<tr><td colspan="4">لا يوجد ساعات إضافية مسجلة</td></tr>';
}

function deleteOvertime(index){
    if(confirm("هل تريد حذف سجل الإضافي هذا؟")){
        const emp=employees.find(e=>e.id==currentEmpId);
        emp.overtime.splice(index,1);
        saveToStorage();
        renderOvertimeTable(emp);
    }
}

// ONLOAD
window.onload = ()=>{
    const saved = localStorage.getItem("employees");
    if(saved) employees=JSON.parse(saved);
    showSection('dashboard');
    renderEmployeeList();
};
</script>

</body>
