<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-database-compat.js"></script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام HR المتكامل - الملف الشخصي المطور</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root { --primary: #2563eb; --secondary: #64748b; --accent: #facc15; --bg-main: #f8fafc; }
        body { font-family: 'Cairo', sans-serif; background-color: var(--bg-main); color: #1e293b; margin: 0; padding: 0; }
        .sidebar-link { transition: all 0.3s ease; cursor: pointer; display: flex; align-items: center; gap: 0.75rem; padding: 1rem; border-radius: 0.75rem; font-weight: 700; color: #cbd5e1; }
        .sidebar-link:hover { background-color: rgba(255,255,255,0.05); color: white; }
        .sidebar-link.active { background: linear-gradient(90deg, #1e40af 0%, #2563eb 100%); border-left: 4px solid var(--accent); color: white; }
        .animate-fade { animation: fadeIn 0.4s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .custom-scrollbar::-webkit-scrollbar { width: 5px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    </style>
</head>
<body class="flex min-h-screen overflow-hidden bg-[#f8fafc]">

    <aside class="w-72 bg-[#0f172a] text-white flex-shrink-0 flex flex-col h-screen z-50 shadow-2xl no-print">
        <div class="p-8 text-center border-b border-slate-800/50">
            <h1 class="text-3xl font-black italic text-white">HR <span class="text-blue-500">CLOUD</span></h1>
        </div>
        <nav class="flex-grow p-4 space-y-1.5 mt-4 overflow-y-auto custom-scrollbar">
            <div onclick="showSection('dashboard')" id="nav-dashboard" class="sidebar-link active">📊 لوحة التحكم</div>
            <div onclick="showSection('employees')" id="nav-employees" class="sidebar-link">👥 الموظفين</div>
            <div onclick="showSection('tasks')" id="nav-tasks" class="sidebar-link">✅ إدارة المهام</div>
        </nav>
    </aside>

    <main class="flex-grow h-screen overflow-hidden flex flex-col">
        <div class="flex-grow overflow-y-auto custom-scrollbar p-8">
            <div id="sections-content">

                <div id="section-employees" class="hidden animate-fade space-y-6">
                    <div class="flex justify-between items-center bg-white p-6 rounded-3xl border border-slate-200">
                        <input type="text" id="employee-search" oninput="renderEmployeesTable()" placeholder="بحث عن موظف..." class="w-96 p-3 bg-slate-50 rounded-2xl outline-none text-sm font-bold">
                        <button onclick="showSection('add-employee')" class="bg-blue-600 text-white px-8 py-3 rounded-2xl font-black">➕ إضافة موظف</button>
                    </div>
                    <div class="bg-white rounded-[2rem] border border-slate-200 shadow-sm overflow-hidden">
                        <table class="w-full text-right">
                            <thead class="bg-slate-50 border-b">
                                <tr class="text-[11px] font-black text-slate-400 uppercase">
                                    <th class="py-5 pr-8">الموظف</th>
                                    <th class="py-5">القسم</th>
                                    <th class="py-5">الحالة</th>
                                    <th class="py-5 text-center">إجراءات</th>
                                </tr>
                            </thead>
                            <tbody id="employees-table-body"></tbody>
                        </table>
                    </div>
                </div>

                <div id="section-profile" class="hidden animate-fade">
                    <div class="max-w-5xl mx-auto space-y-6">
                        <div class="bg-white p-6 rounded-[2rem] border border-slate-200 shadow-sm flex justify-between items-center">
                            <div class="flex items-center gap-4">
                                <div id="prof-avatar" class="w-16 h-16 rounded-2xl bg-blue-600 text-white flex items-center justify-center text-2xl font-black"></div>
                                <div>
                                    <h3 id="prof-name" class="text-2xl font-black text-slate-800"></h3>
                                    <p id="prof-id-display" class="text-[10px] text-blue-500 font-bold uppercase"></p>
                                </div>
                            </div>
                            <button onclick="showSection('employees')" class="bg-slate-100 text-slate-600 px-6 py-2 rounded-xl font-bold text-xs">إغلاق</button>
                        </div>

                        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                            <div class="space-y-6">
                                <div class="bg-white p-8 rounded-[2rem] border border-slate-200 text-center">
                                    <p class="text-[10px] text-slate-400 font-bold uppercase">المرتب الشهري</p>
                                    <h4 id="prof-salary" class="text-3xl font-black text-slate-800 my-2"></h4>
                                    <div class="flex gap-2 mt-6">
                                        <button class="flex-grow bg-emerald-50 text-emerald-600 p-3 rounded-2xl text-[10px] font-black">🌴 إجازة</button>
                                        <button onclick="openOTModal()" class="flex-grow bg-blue-50 text-blue-600 p-3 rounded-2xl text-[10px] font-black">⏱️ إضافي</button>
                                    </div>
                                </div>
                                
                                <div class="bg-white p-6 rounded-[2rem] border border-slate-200">
                                    <h4 class="text-xs font-black mb-4">📝 المهام الحالية</h4>
                                    <div class="flex gap-2 mb-4">
                                        <input type="text" id="prof-task-input" placeholder="مهمة جديدة..." class="flex-grow p-2 bg-slate-50 rounded-lg text-[10px] border-none outline-none font-bold">
                                        <button id="add-task-btn" class="bg-blue-600 text-white px-3 rounded-lg text-[10px] font-black">➕</button>
                                    </div>
                                    <div id="prof-tasks-list" class="space-y-2 max-h-48 overflow-y-auto custom-scrollbar"></div>
                                </div>
                            </div>

                            <div class="lg:col-span-2 space-y-6">
                                <div class="bg-white p-8 rounded-[2rem] border border-slate-200">
                                    <h4 class="text-sm font-black text-slate-800 mb-6 italic underline decoration-blue-500 underline-offset-8">المعلومات الوظيفية</h4>
                                    <div class="grid grid-cols-2 md:grid-cols-3 gap-6">
                                        <div><p class="text-[9px] text-slate-400 font-bold uppercase">المسمى</p><p id="prof-title" class="font-black text-slate-700 text-sm"></p></div>
                                        <div><p class="text-[9px] text-slate-400 font-bold uppercase">القسم</p><p id="prof-dept" class="font-black text-slate-700 text-sm"></p></div>
                                        <div><p class="text-[9px] text-slate-400 font-bold uppercase">المباشرة</p><p id="prof-join" class="font-black text-slate-700 text-sm"></p></div>
                                        <div><p class="text-[9px] text-slate-400 font-bold uppercase">فصيلة الدم</p><p id="prof-blood" class="font-black text-rose-600 text-sm"></p></div>
                                        <div><p class="text-[9px] text-slate-400 font-bold uppercase">الإجازات</p><p id="prof-leave" class="font-black text-blue-600 text-sm"></p></div>
                                        <div><p class="text-[9px] text-slate-400 font-bold uppercase">الجنسية</p><p id="prof-nat" class="font-black text-slate-700 text-sm"></p></div>
                                    </div>
                                    <div class="mt-8 p-4 bg-blue-50 rounded-2xl border border-blue-100 flex justify-between items-center">
                                        <span class="text-xs font-black text-blue-800 italic uppercase tracking-widest">Employee Tenure</span>
                                        <span id="prof-tenure" class="text-lg font-black text-blue-600"></span>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </main>

    <script>
        // --- إعدادات Firebase (يرجى وضع بياناتك هنا) ---
        const firebaseConfig = { databaseURL: "YOUR_DATABASE_URL" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let employees = [];

        // دالة عرض الأقسام
        function showSection(sectionId) {
            document.querySelectorAll('#sections-content > div').forEach(div => div.classList.add('hidden'));
            document.getElementById('section-' + sectionId).classList.remove('hidden');
        }

        // جلب الموظفين من Firebase
        db.ref('employees').on('value', (snapshot) => {
            employees = [];
            const data = snapshot.val();
            if (data) {
                Object.keys(data).forEach(key => employees.push({ id: key, ...data[key] }));
            }
            renderEmployeesTable();
        });

        // رندر الجدول مع ربط الملف الشخصي بالضغط على الاسم
        function renderEmployeesTable() {
            const container = document.getElementById('employees-table-body');
            container.innerHTML = employees.map(e => `
                <tr class="border-b border-slate-50 hover:bg-blue-50/50 transition-all group">
                    <td class="py-4 pr-8 cursor-pointer" onclick="viewEmployeeProfile('${e.id}')">
                        <div class="flex items-center gap-3">
                            <div class="w-8 h-8 rounded-lg bg-blue-100 text-blue-600 flex items-center justify-center font-black text-[10px] uppercase">${e.name.substring(0,1)}</div>
                            <span class="font-bold text-slate-800 text-sm group-hover:text-blue-600">${e.name}</span>
                        </div>
                    </td>
                    <td class="py-4 text-xs font-bold text-slate-500">${e.dept || '-'}</td>
                    <td class="py-4"><span class="px-2 py-1 bg-emerald-50 text-emerald-600 text-[9px] font-black rounded-full">نشط</span></td>
                    <td class="py-4 text-center">
                        <button onclick="viewEmployeeProfile('${e.id}')" class="text-slate-300 hover:text-blue-600 px-2">👁️</button>
                    </td>
                </tr>
            `).join('');
        }

        // دالة عرض الملف الشخصي المحدثة
        function viewEmployeeProfile(id) {
            const emp = employees.find(e => e.id === id);
            if (!emp) return;

            // ملء البيانات الأساسية
            document.getElementById('prof-name').innerText = emp.name;
            document.getElementById('prof-avatar').innerText = emp.name.substring(0, 1).toUpperCase();
            document.getElementById('prof-id-display').innerText = `ID: ${emp.empIdNum || '0000'}`;
            document.getElementById('prof-title').innerText = emp.jobTitle || 'غير محدد';
            document.getElementById('prof-dept').innerText = emp.dept || 'عام';
            document.getElementById('prof-join').innerText = emp.joinDate || '---';
            document.getElementById('prof-salary').innerText = emp.salary ? `${emp.salary} ر.س` : '0 ر.س';
            document.getElementById('prof-blood').innerText = emp.bloodType || '---';
            document.getElementById('prof-nat').innerText = emp.nationality || '---';
            document.getElementById('prof-leave').innerText = (emp.leaveBal || 30) + " يوم";

            // حساب الأقدمية
            if (emp.joinDate) {
                const join = new Date(emp.joinDate);
                const diff = new Date() - join;
                const years = Math.floor(diff / (1000 * 60 * 60 * 24 * 365));
                const months = Math.floor((diff % (1000 * 60 * 60 * 24 * 365)) / (1000 * 60 * 60 * 24 * 30));
                document.getElementById('prof-tenure').innerText = `${years} سنة و ${months} شهر`;
            }

            // ربط المهام لهذا الموظف
            const taskBtn = document.getElementById('add-task-btn');
            taskBtn.onclick = () => {
                const input = document.getElementById('prof-task-input');
                if(!input.value) return;
                db.ref('employee_tasks').push({ empId: id, text: input.value, status: 'pending' });
                input.value = "";
            };

            // الاستماع لمهام الموظف
            db.ref('employee_tasks').orderByChild('empId').equalTo(id).on('value', (snap) => {
                const list = document.getElementById('prof-tasks-list');
                list.innerHTML = "";
                const tasks = snap.val();
                if(tasks) {
                    Object.keys(tasks).forEach(key => {
                        const t = tasks[key];
                        list.innerHTML += `
                            <div class="p-2 bg-slate-50 rounded-lg flex justify-between items-center group">
                                <span class="text-[10px] font-bold ${t.status==='done'?'line-through text-slate-400':''}">${t.text}</span>
                                <div class="flex gap-1 opacity-0 group-hover:opacity-100 transition-all">
                                    <button onclick="db.ref('employee_tasks/${key}').update({status:'done'})" class="text-emerald-500 text-[10px]">✔️</button>
                                    <button onclick="db.ref('employee_tasks/${key}').remove()" class="text-rose-500 text-[10px]">🗑️</button>
                                </div>
                            </div>`;
                    });
                }
            });

            showSection('profile');
        }

        // تشغيل القسم الأول عند التحميل
        showSection('employees');
    </script>
</body>
</html>
