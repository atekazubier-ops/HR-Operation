<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>موقعي المتصل بـ Firebase</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f4f7f6;
        }
        .container {
            background: white;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            text-align: center;
            width: 350px;
        }
        h1 { color: #333; font-size: 1.5rem; }
        input {
            width: 100%;
            padding: 10px;
            margin: 15px 0;
            border: 1px solid #ddd;
            border-radius: 6px;
            box-sizing: border-box;
        }
        button {
            background-color: #039be5;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            font-size: 1rem;
            transition: background 0.3s;
        }
        button:hover { background-color: #0277bd; }
        #status {
            margin-top: 15px;
            font-size: 0.9rem;
            color: #666;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>مرحباً بك في موقعي!</h1>
        <p>أدخل اسمك لحفظه في Firebase</p>
        
        <input type="text" id="userName" placeholder="اكتب اسمك هنا...">
        <button id="saveButton">إرسال البيانات</button>
        
        <p id="status"></p>
    </div>

    <script type="module">
        // استيراد المكتبات من CDN
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        import { getAnalytics } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-analytics.js";

        // إعدادات Firebase الخاصة بمشروعك
        const firebaseConfig = {
            apiKey: "AIzaSyCy5VroP_MGxOXUHxN0KJLStmGE_iV0UFY",
            authDomain: "test-81dcc.firebaseapp.com",
            projectId: "test-81dcc",
            storageBucket: "test-81dcc.firebasestorage.app",
            messagingSenderId: "462100667219",
            appId: "1:462100667219:web:1cc7819a81799e3022dfa6",
            measurementId: "G-2M9HZYTYTN"
        };

        // تهيئة التطبيق
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const analytics = getAnalytics(app);

        // عناصر الواجهة
        const btn = document.getElementById('saveButton');
        const input = document.getElementById('userName');
        const status = document.getElementById('status');

        // وظيفة الإرسال
        btn.onclick = async () => {
            const nameValue = input.value.trim();
            
            if(!nameValue) {
                status.innerText = "الرجاء كتابة اسم أولاً! ⚠️";
                return;
            }

            status.innerText = "جاري الإرسال... ⏳";
            btn.disabled = true;

            try {
                // إضافة مستند جديد إلى مجموعة "users"
                await addDoc(collection(db, "users"), {
                    name: nameValue,
                    createdAt: new Date()
                });

                status.style.color = "green";
                status.innerText = "تم الحفظ في Firebase بنجاح! ✅";
                input.value = ""; // تفريغ الحقل
            } catch (error) {
                console.error("Error: ", error);
                status.style.color = "red";
                status.innerText = "خطأ في الإرسال، تأكد من إعدادات Rules في Firebase.";
            } finally {
                btn.disabled = false;
            }
        };
    </script>
</body>
</html>
