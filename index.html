<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>

    <script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-database-compat.js"></script>

            databaseURL: "https://test-81dcc-default-rtdb.firebaseio.com",
            projectId: "test-81dcc",
            storageBucket: "test-81dcc.firebasestorage.app",
            messagingSenderId: "462100667219",
            appId: "1:462100667219:web:1cc7819a81799e3022dfa6",

        // تهيئة التطبيق
        firebase.initializeApp(firebaseConfig);

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام HR المتكامل - الإصدار السحابي</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #2563eb; --bg-main: #f8fafc; }
        body { font-family: 'Cairo', sans-serif; background-color: var(--bg-main); }
        .sidebar-link.active { background: linear-gradient(90deg, #1e40af 0%, #2563eb 100%); border-left: 4px solid #facc15; }
        .hidden-section { display: none; }
        input { border: 1px solid #e2e8f0; padding: 12px; border-radius: 12px; width: 100%; margin-bottom: 10px; }
    </style>
</head>
<body class="flex min-h-screen">

    <aside class="w-72 bg-slate-900 text-white flex flex-col shadow-2xl z-50">
        <div class="p-8">
            <div class="text-2xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-yellow-400">HR CLOUD ✨</div>
            <p class="text-slate-500 text-[10px] mt-1 font-bold uppercase">الإصدار السحابي 1.0</p>
        </div>
        <nav class="flex-1 px-4 space-y-2">
            <a href="#" onclick="showSection('dashboard')" class="sidebar-link flex items-center p-3 rounded-xl hover:bg-slate-800 active" id="link-dashboard">📊 لوحة التحكم</a>
            <a href="#" onclick="showSection('employees')" class="sidebar-link flex items-center p-3 rounded-xl hover:bg-slate-800" id="link-employees">👥 إدارة الموظفين</a>
        </nav>
    </aside>

    <main class="flex-1 flex flex-col overflow-hidden">
        <header class="bg-white shadow-sm p-4 flex justify-between items-center border-b">
            <h2 id="section-title" class="text-xl font-bold">نظام شؤون الموظفين</h2>
            <button onclick="showSection('add-form')" class="bg-blue-600 text-white px-6 py-2 rounded-xl font-bold">+ موظف جديد</button>
        </header>

        <div class="flex-1 overflow-y-auto p-8">
            <section id="dashboard">
                <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
                    <div class="bg-white p-6 rounded-3xl shadow-sm border text-center">
                        <p class="text-slate-400 font-bold text-xs">إجمالي الموظفين</p>
                        <h3 id="stat-count" class="text-3xl font-black mt-2">0</h3>
                    </div>
                </div>
                <div class="bg-white rounded-3xl border shadow-sm overflow-hidden">
                    <div class="p-6 border-b font-bold">آخر الموظفين المضافين (سحابياً)</div>
                    <table class="w-full text-right">
                        <thead class="bg-slate-50">
                            <tr><th class="p-4">الاسم</th><th class="p-4">القسم</th><th class="p-4">الحالة</th></tr>
                        </thead>
                        <tbody id="dash-table"></tbody>
                    </table>
                </div>
            </section>

            <section id="employees" class="hidden-section">
                <div class="bg-white rounded-3xl border shadow-sm p-6">
                    <table class="w-full text-right">
                        <thead><tr class="border-b"><th class="p-4">الاسم</th><th class="p-4">القسم</th><th class="p-4">الحالة</th></tr></thead>
                        <tbody id="emp-list-table"></tbody>
                    </table>
                </div>
            </section>

            <section id="add-form" class="hidden-section">
                <div class="bg-white p-8 rounded-3xl border shadow-lg max-w-2xl mx-auto">
                    <h3 class="text-2xl font-bold mb-6 text-blue-800">إضافة موظف للسحابة</h3>
                    <div class="space-y-4">
                        <input type="text" id="emp_name" placeholder="اسم الموظف">
                        <input type="text" id="emp_dept" placeholder="القسم">
                        <button onclick="saveToCloud()" class="w-full bg-blue-600 text-white py-4 rounded-2xl font-bold">حفظ في قاعدة البيانات</button>
                    </div>
                </div>
            </section>
        </div>
    </main>

    <script>
        let employees = [];

        // 1. جلب البيانات تلقائياً عند أي تغيير
        database.ref('employees').on('value', (snapshot) => {
            const data = snapshot.val();
            employees = data ? Object.values(data) : [];
            updateUI();
        });

        // 2. وظيفة الحفظ
        function saveToCloud() {
            const name = document.getElementById('emp_name').value;
            const dept = document.getElementById('emp_dept').value;

            if(name && dept) {
                const newEmp = { name, dept, date: new Date().toLocaleDateString() };
                
                database.ref('employees').push(newEmp)
                    .then(() => {
                        alert("تم الحفظ في السحابة بنجاح!");
                        document.getElementById('emp_name').value = "";
                        document.getElementById('emp_dept').value = "";
                        showSection('dashboard');
                    })
                    .catch((error) => {
                        alert("خطأ: " + error.message);
                    });
            } else {
                alert("يرجى ملء جميع الحقول");
            }
        }

        function updateUI() {
            document.getElementById('stat-count').innerText = employees.length;
            const table = document.getElementById('dash-table');
            const listTable = document.getElementById('emp-list-table');
            table.innerHTML = "";
            listTable.innerHTML = "";

            employees.forEach(emp => {
                const row = `<tr class="border-b"><td class="p-4 font-bold">${emp.name}</td><td class="p-4">${emp.dept}</td><td class="p-4 text-green-600 font-bold">متصل سحابياً</td></tr>`;
                table.innerHTML += row;
                listTable.innerHTML += row;
            });
        }

        function showSection(id) {
            document.querySelectorAll('section').forEach(s => s.classList.add('hidden-section'));
            document.querySelectorAll('.sidebar-link').forEach(l => l.classList.remove('active'));
            document.getElementById(id).classList.remove('hidden-section');
            if(document.getElementById('link-' + id)) {
                document.getElementById('link-' + id).classList.add('active');
            }
        }
    </script>
</body>
</html>
