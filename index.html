<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام HR الذكي - تسجيل الدخول</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --primary-hr: #ff6b4a; /* اللون البرتقالي المعتمد في التصميم */
            --bg-light: #f4f7f6;
            --dark-sidebar: #1a1e2b;
        }

        body { font-family: 'Segoe UI', sans-serif; margin: 0; background: var(--bg-light); }

        /* --- 1. تنسيق صفحة تسجيل الدخول --- */
        #login-page {
            display: flex; justify-content: center; align-items: center;
            height: 100vh; background: var(--dark-sidebar);
        }
        .login-card {
            background: white; padding: 40px; border-radius: 15px;
            width: 350px; text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }
        .login-card h2 { color: var(--dark-sidebar); margin-bottom: 25px; }
        .login-card input {
            width: 100%; padding: 12px; margin-bottom: 15px;
            border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box;
        }

        /* --- 2. تنسيق لوحة التحكم (مخفية افتراضياً) --- */
        #dashboard-page { display: none; height: 100vh; }
        
        .sidebar { width: 250px; background: var(--dark-sidebar); color: white; display: flex; flex-direction: column; }
        .main-content { flex: 1; padding: 30px; overflow-y: auto; }
        
        .nav-link { padding: 15px 20px; color: #adb5bd; text-decoration: none; display: flex; align-items: center; }
        .nav-link:hover, .active { background: #252b3b; color: white; border-right: 4px solid var(--primary-hr); }
        .nav-link i { margin-left: 10px; }

        .stat-card { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        
        button {
            background: var(--primary-hr); color: white; border: none;
            padding: 12px; border-radius: 8px; cursor: pointer; width: 100%; font-weight: bold;
        }
        .logout-btn { background: #ff4d4d; margin-top: auto; border-radius: 0; }
    </style>
</head>
<body>

    <div id="login-page">
        <div class="login-card">
            <i class="fas fa-user-shield fa-3x" style="color: var(--primary-hr); margin-bottom: 15px;"></i>
            <h2>دخول موظفي HR</h2>
            <input type="email" id="loginEmail" placeholder="البريد الإلكتروني">
            <input type="password" id="loginPassword" placeholder="كلمة المرور">
            <button id="loginBtn">تسجيل الدخول</button>
            <p id="loginError" style="color: red; font-size: 13px; margin-top: 10px;"></p>
        </div>
    </div>

    <div id="dashboard-page" style="display: flex;">
        <div class="sidebar">
            <div style="padding: 25px; font-size: 22px; font-weight: bold; border-bottom: 1px solid #2d3243;">
                <i class="fas fa-users-cog" style="color: var(--primary-hr);"></i> HR Portal
            </div>
            <a href="#" class="nav-link active"><i class="fas fa-chart-line"></i> الإحصائيات</a>
            <a href="#" class="nav-link"><i class="fas fa-user-friends"></i> قائمة الموظفين</a>
            <a href="#" class="nav-link"><i class="fas fa-calendar-alt"></i> الإجازات</a>
            <button class="logout-btn" id="logoutBtn"><i class="fas fa-sign-out-alt"></i> تسجيل الخروج</button>
        </div>

        <div class="main-content">
            <h1>لوحة إدارة الموارد البشرية</h1>
            <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-top: 20px;">
                <div class="stat-card">
                    <h3>إجمالي الموظفين</h3>
                    <h2 id="empCount" style="color: var(--primary-hr);">0</h2>
                </div>
                <div class="stat-card">
                    <h3>موظفون حاضرون</h3>
                    <h2 style="color: #0acf97;">12</h2>
                </div>
                <div class="stat-card">
                    <h3>طلبات إجازة</h3>
                    <h2 style="color: #ffbc00;">5</h2>
                </div>
            </div>
            
            <div style="background: white; padding: 25px; border-radius: 12px; margin-top: 30px;">
                <h3>إضافة موظف جديد</h3>
                <div style="display: flex; gap: 10px;">
                    <input type="text" id="empName" placeholder="اسم الموظف بالكامل" style="flex: 2; padding: 10px; border-radius: 5px; border: 1px solid #ddd;">
                    <button id="addEmpBtn" style="flex: 1;">إضافة للملفات</button>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        // استيراد Firebase SDK
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        // إعدادات مشروعك
        const firebaseConfig = {
            apiKey: "AIzaSyCy5VroP_MGxOXUHxN0KJLStmGE_iV0UFY",
            authDomain: "test-81dcc.firebaseapp.com",
            projectId: "test-81dcc",
            storageBucket: "test-81dcc.firebasestorage.app",
            messagingSenderId: "462100667219",
            appId: "1:462100667219:web:1cc7819a81799e3022dfa6"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // --- وظائف التحكم في الواجهة ---

        // 1. تسجيل الدخول
        document.getElementById('loginBtn').onclick = async () => {
            const email = document.getElementById('loginEmail').value;
            const pass = document.getElementById('loginPassword').value;
            try {
                await signInWithEmailAndPassword(auth, email, pass);
            } catch (error) {
                document.getElementById('loginError').innerText = "خطأ: البريد أو كلمة المرور غير صحيحة";
            }
        };

        // 2. مراقبة حالة المستخدم (هل هو مسجل دخول أم لا؟)
        onAuthStateChanged(auth, (user) => {
            if (user) {
                // مستخدم مسجل -> اظهر الداشبورد واخفِ تسجيل الدخول
                document.getElementById('login-page').style.display = 'none';
                document.getElementById('dashboard-page').style.display = 'flex';
                loadData();
            } else {
                // مستخدم غير مسجل -> اظهر صفحة الدخول
                document.getElementById('login-page').style.display = 'flex';
                document.getElementById('dashboard-page').style.display = 'none';
            }
        });

        // 3. تسجيل الخروج
        document.getElementById('logoutBtn').onclick = () => signOut(auth);

        // 4. إدارة بيانات الموظفين
        function loadData() {
            onSnapshot(collection(db, "employees"), (snap) => {
                document.getElementById('empCount').innerText = snap.size;
            });
        }

        document.getElementById('addEmpBtn').onclick = async () => {
            const name = document.getElementById('empName').value;
            if(name) {
                await addDoc(collection(db, "employees"), { name: name, date: new Date() });
                document.getElementById('empName').value = "";
                alert("تمت إضافة الموظف بنجاح");
            }
        };
    </script>
</body>
</html>
