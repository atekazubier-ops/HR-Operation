<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-database-compat.js"></script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HR Cloud - Advanced Profile</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Cairo', sans-serif; background-color: #f8fafc; color: #1e293b; }
        .nav-card.active { background: #eff6ff; color: #2563eb; border-right: 4px solid #2563eb; }
        .glass-modal { background: rgba(255, 255, 255, 0.8); backdrop-filter: blur(12px); }
        .stat-card { transition: all 0.3s ease; border: 1px solid #e2e8f0; }
        .stat-card:hover { transform: translateY(-5px); box-shadow: 0 10px 20px -10px rgba(0,0,0,0.1); }
        .btn-primary { background: linear-gradient(135deg, #2563eb, #1e40af); }
    </style>
</head>
<body class="flex flex-col md:flex-row min-h-screen">

    <!-- Sidebar -->
    <aside class="w-full md:w-64 bg-white border-l flex-shrink-0 z-50">
        <div class="p-6">
            <div class="flex items-center gap-3 mb-10">
                <div class="w-10 h-10 btn-primary rounded-lg flex items-center justify-center text-white font-bold">HR</div>
                <h1 class="text-xl font-black text-slate-800">النظام السحابي</h1>
            </div>
            <nav class="space-y-2">
                <button onclick="showSection('dashboard')" id="btn-dashboard" class="nav-card active w-full flex items-center gap-3 p-3 rounded-xl text-sm font-bold text-slate-600">📊 لوحة التحكم</button>
                <button onclick="showSection('employees')" id="btn-employees" class="nav-card w-full flex items-center gap-3 p-3 rounded-xl text-sm font-bold text-slate-600">👥 الموظفين</button>
                <button onclick="showSection('birthdays')" id="btn-birthdays" class="nav-card w-full flex items-center gap-3 p-3 rounded-xl text-sm font-bold text-slate-600">🎂 أعياد الميلاد</button>
            </nav>
        </div>
    </aside>

    <!-- Main -->
    <main class="flex-grow p-4 md:p-10">
        <header class="flex justify-between items-center mb-10">
            <h2 id="section-title" class="text-2xl font-black">لوحة التحكم</h2>
            <div id="cloud-status" class="text-[10px] bg-green-100 text-green-700 px-3 py-1 rounded-full font-bold uppercase tracking-widest">متصل سحابياً</div>
        </header>

        <!-- Content Area -->
        <div id="section-dashboard" class="space-y-8">
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                <div class="stat-card bg-white p-6 rounded-3xl">
                    <p class="text-xs font-bold text-slate-400">إجمالي الموظفين</p>
                    <h3 id="stat-emp-count" class="text-3xl font-black mt-2">0</h3>
                </div>
                <div class="stat-card bg-white p-6 rounded-3xl border-t-4 border-pink-500">
                    <p class="text-xs font-bold text-slate-400">ميلاد هذا الشهر</p>
                    <h3 id="stat-bd-count" class="text-3xl font-black mt-2">0</h3>
                </div>
            </div>
            <div class="bg-white p-8 rounded-3xl border border-slate-100">
                <h4 class="font-black mb-6">🎂 احتفالات قريبة</h4>
                <div id="dash-birthdays-list" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
            </div>
        </div>

        <div id="section-employees" class="hidden space-y-6">
            <div class="flex justify-between items-center">
                <input type="text" id="empSearch" oninput="renderEmployees()" placeholder="ابحث عن موظف..." class="p-3 bg-white border rounded-xl w-64 outline-none focus:ring-2 focus:ring-blue-500">
                <button onclick="openModal('addEmpModal')" class="btn-primary text-white px-6 py-3 rounded-xl font-bold text-sm shadow-lg shadow-blue-200">إضافة موظف شامل</button>
            </div>
            <div class="bg-white rounded-3xl border overflow-hidden shadow-sm">
                <table class="w-full text-right">
                    <thead class="bg-slate-50 border-b">
                        <tr>
                            <th class="p-4 text-xs font-black text-slate-500">الموظف</th>
                            <th class="p-4 text-xs font-black text-slate-500">القسم / المنصب</th>
                            <th class="p-4 text-xs font-black text-slate-500">الجنسية</th>
                            <th class="p-4 text-xs font-black text-slate-500">العمليات</th>
                        </tr>
                    </thead>
                    <tbody id="empTableBody" class="divide-y"></tbody>
                </table>
            </div>
        </div>

        <div id="section-birthdays" class="hidden">
             <div id="birthdaysContainer" class="grid grid-cols-1 md:grid-cols-4 gap-6"></div>
        </div>
    </main>

    <!-- Modal: Add Employee (Combined Fields) -->
    <div id="addEmpModal" class="fixed inset-0 glass-modal hidden z-[100] flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-4xl rounded-[2.5rem] shadow-2xl overflow-hidden">
            <div class="p-8 border-b flex justify-between items-center bg-slate-50">
                <h3 class="text-xl font-black">إضافة ملف موظف شامل</h3>
                <button onclick="closeModal('addEmpModal')" class="text-2xl font-bold">&times;</button>
            </div>
            <form id="addEmpForm" onsubmit="saveEmployee(event)" class="p-8 grid grid-cols-1 md:grid-cols-3 gap-5 max-h-[75vh] overflow-y-auto">
                <!-- Basic Info -->
                <div class="space-y-1"><label class="text-[10px] font-bold text-slate-400">الاسم الكامل</label><input type="text" id="f_name" class="w-full p-3 bg-slate-50 rounded-xl outline-none" required></div>
                <div class="space-y-1"><label class="text-[10px] font-bold text-slate-400">رقم الهوية</label><input type="text" id="f_id" class="w-full p-3 bg-slate-50 rounded-xl outline-none" required></div>
                <div class="space-y-1"><label class="text-[10px] font-bold text-slate-400">تاريخ الميلاد</label><input type="date" id="f_birth_date" class="w-full p-3 bg-pink-50 rounded-xl outline-none" required></div>
                
                <!-- Advanced Info from Previous File -->
                <div class="space-y-1"><label class="text-[10px] font-bold text-slate-400">الجنسية</label><input type="text" id="f_nat" class="w-full p-3 bg-slate-50 rounded-xl outline-none"></div>
                <div class="space-y-1"><label class="text-[10px] font-bold text-slate-400">فصيلة الدم</label><input type="text" id="f_blood" class="w-full p-3 bg-slate-50 rounded-xl outline-none"></div>
                <div class="space-y-1"><label class="text-[10px] font-bold text-slate-400">العنوان</label><input type="text" id="f_address" class="w-full p-3 bg-slate-50 rounded-xl outline-none"></div>
                
                <div class="space-y-1"><label class="text-[10px] font-bold text-slate-400">القسم</label><input type="text" id="f_dept" class="w-full p-3 bg-slate-50 rounded-xl outline-none"></div>
                <div class="space-y-1"><label class="text-[10px] font-bold text-slate-400">المسمى الوظيفي</label><input type="text" id="f_pos" class="w-full p-3 bg-slate-50 rounded-xl outline-none"></div>
                <div class="space-y-1"><label class="text-[10px] font-bold text-slate-400">الراتب الأساسي</label><input type="number" id="f_salary" class="w-full p-3 bg-slate-50 rounded-xl outline-none"></div>
                
                <div class="space-y-1"><label class="text-[10px] font-bold text-slate-400">تاريخ المباشرة</label><input type="date" id="f_start_date" class="w-full p-3 bg-slate-50 rounded-xl outline-none"></div>
                <div class="space-y-1"><label class="text-[10px] font-bold text-slate-400">رصيد الإجازات</label><input type="number" id="f_leave_bal" value="30" class="w-full p-3 bg-slate-50 rounded-xl outline-none"></div>
                
                <button type="submit" class="md:col-span-3 btn-primary text-white py-4 rounded-2xl font-black mt-4 shadow-xl">حفظ الملف السحابي</button>
            </form>
        </div>
    </div>

    <!-- Modal: Profile Details -->
    <div id="detailsModal" class="fixed inset-0 glass-modal hidden z-[100] flex items-center justify-center p-4">
        <div class="bg-slate-50 w-full max-w-5xl h-[85vh] rounded-[3rem] shadow-2xl flex flex-col overflow-hidden border border-white">
            <div class="p-8 bg-white border-b flex justify-between items-center">
                <div class="flex items-center gap-4">
                    <div class="w-14 h-14 btn-primary rounded-2xl flex items-center justify-center text-white text-xl font-bold">👤</div>
                    <div>
                        <h3 id="prof-name" class="text-2xl font-black">اسم الموظف</h3>
                        <p id="prof-pos" class="text-xs font-bold text-blue-600 uppercase"></p>
                    </div>
                </div>
                <button onclick="closeModal('detailsModal')" class="w-10 h-10 bg-slate-100 rounded-full flex items-center justify-center font-bold text-xl">&times;</button>
            </div>
            <div id="detailsContent" class="flex-grow overflow-y-auto p-8 grid grid-cols-1 lg:grid-cols-3 gap-8">
                <!-- Content will be injected here -->
            </div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAAe-WjGh9PtL932wxJPgLSuaslmJWaDC8",
            authDomain: "hr-operation.firebaseapp.com",
            databaseURL: "https://hr-operation-default-rtdb.firebaseio.com",
            projectId: "hr-operation",
            storageBucket: "hr-operation.firebasestorage.app",
            messagingSenderId: "498775599728",
            appId: "1:498775599728:web:b195dea758f3cf415162b5"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        let employees = [];

        function initSync() {
            db.ref('employees_v20_full').on('value', snapshot => {
                const val = snapshot.val();
                employees = val ? Object.entries(val).map(([id, data]) => ({ id, ...data })) : [];
                renderAll();
            });
        }

        function showSection(id) {
            ['dashboard', 'employees', 'birthdays'].forEach(s => {
                document.getElementById('section-' + s).classList.add('hidden');
                document.getElementById('btn-' + s).classList.remove('active');
            });
            document.getElementById('section-' + id).classList.remove('hidden');
            document.getElementById('btn-' + id).classList.add('active');
            document.getElementById('section-title').innerText = document.getElementById('btn-' + id).innerText.split(' ')[1];
        }

        function openModal(id) { document.getElementById(id).classList.remove('hidden'); }
        function closeModal(id) { document.getElementById(id).classList.add('hidden'); }

        function saveEmployee(e) {
            e.preventDefault();
            const newEmp = {
                name: document.getElementById('f_name').value,
                idCard: document.getElementById('f_id').value,
                birthDate: document.getElementById('f_birth_date').value,
                nat: document.getElementById('f_nat').value,
                blood: document.getElementById('f_blood').value,
                address: document.getElementById('f_address').value,
                dept: document.getElementById('f_dept').value,
                pos: document.getElementById('f_pos').value,
                salary: document.getElementById('f_salary').value,
                startDate: document.getElementById('f_start_date').value,
                leaveBal: document.getElementById('f_leave_bal').value,
                actions: []
            };
            db.ref('employees_v20_full').push(newEmp).then(() => {
                closeModal('addEmpModal');
                e.target.reset();
            });
        }

        function renderAll() {
            renderEmployees();
            renderBirthdays();
            updateStats();
        }

        function renderEmployees() {
            const query = document.getElementById('empSearch').value.toLowerCase();
            const tbody = document.getElementById('empTableBody');
            tbody.innerHTML = employees.filter(e => e.name.toLowerCase().includes(query))
                .map(emp => `
                    <tr class="hover:bg-slate-50 transition-colors">
                        <td class="p-4">
                            <div class="font-bold text-slate-800">${emp.name}</div>
                            <div class="text-[10px] text-slate-400 uppercase font-bold tracking-tight">ID: ${emp.idCard}</div>
                        </td>
                        <td class="p-4">
                            <div class="text-xs font-bold text-blue-600">${emp.dept}</div>
                            <div class="text-[10px] text-slate-500">${emp.pos || '---'}</div>
                        </td>
                        <td class="p-4 text-xs font-bold text-slate-500">${emp.nat || '---'}</td>
                        <td class="p-4">
                            <button onclick="viewProfile('${emp.id}')" class="text-xs font-black bg-slate-800 text-white px-4 py-2 rounded-xl">عرض الملف</button>
                        </td>
                    </tr>
                `).join('');
        }

        function viewProfile(id) {
            const emp = employees.find(e => e.id === id);
            document.getElementById('prof-name').innerText = emp.name;
            document.getElementById('prof-pos').innerText = `${emp.pos} - ${emp.dept}`;
            
            document.getElementById('detailsContent').innerHTML = `
                <div class="lg:col-span-1 space-y-6">
                    <div class="bg-white p-6 rounded-3xl shadow-sm space-y-4">
                        <h4 class="font-black text-xs text-blue-600 uppercase border-b pb-2">المعلومات الشخصية</h4>
                        <div class="flex justify-between"><span class="text-xs text-slate-400">الجنسية:</span> <span class="text-xs font-bold">${emp.nat || '---'}</span></div>
                        <div class="flex justify-between"><span class="text-xs text-slate-400">فصيلة الدم:</span> <span class="text-xs font-bold">${emp.blood || '---'}</span></div>
                        <div class="flex justify-between"><span class="text-xs text-slate-400">تاريخ الميلاد:</span> <span class="text-xs font-bold text-pink-600">${emp.birthDate || '---'}</span></div>
                        <div class="flex justify-between"><span class="text-xs text-slate-400">العنوان:</span> <span class="text-xs font-bold">${emp.address || '---'}</span></div>
                    </div>
                    <div class="bg-slate-900 text-white p-6 rounded-3xl shadow-sm space-y-4">
                        <h4 class="font-black text-xs text-slate-500 uppercase border-b border-slate-700 pb-2">معلومات العمل</h4>
                        <div class="flex justify-between"><span class="text-xs text-slate-400">الراتب الأساسي:</span> <span class="text-xs font-bold text-green-400">${emp.salary} ر.س</span></div>
                        <div class="flex justify-between"><span class="text-xs text-slate-400">رصيد الإجازات:</span> <span class="text-xs font-bold text-orange-400">${emp.leaveBal} يوم</span></div>
                        <div class="flex justify-between"><span class="text-xs text-slate-400">تاريخ المباشرة:</span> <span class="text-xs font-bold">${emp.startDate}</span></div>
                    </div>
                </div>
                <div class="lg:col-span-2 bg-white p-8 rounded-3xl shadow-sm h-full">
                    <div class="flex justify-between items-center mb-6">
                        <h4 class="font-black">الإجراءات والسجل الإداري</h4>
                        <button onclick="addAction('${emp.id}')" class="text-[10px] font-black bg-rose-50 text-rose-600 px-4 py-2 rounded-xl">+ إضافة إجراء</button>
                    </div>
                    <div class="space-y-3">
                        ${renderActions(emp)}
                    </div>
                </div>
            `;
            openModal('detailsModal');
        }

        function renderActions(emp) {
            if(!emp.actions) return '<p class="text-center py-10 text-slate-300 italic">لا توجد سجلات حالياً</p>';
            return Object.values(emp.actions).map(a => `
                <div class="p-4 bg-slate-50 rounded-2xl flex justify-between items-center">
                    <div>
                        <p class="text-xs font-black text-slate-800">${a.kind}</p>
                        <p class="text-[10px] text-slate-400">${a.reason}</p>
                    </div>
                    <span class="text-[10px] font-bold text-slate-400">${a.date}</span>
                </div>
            `).join('');
        }

        function addAction(empId) {
            const kind = prompt("نوع الإجراء (مثلاً: تنبيه، مكافأة، خصم):");
            const reason = prompt("السبب بالتفصيل:");
            if(kind && reason) {
                db.ref(`employees_v20_full/${empId}/actions`).push({
                    kind, reason, date: new Date().toLocaleDateString('ar-SA')
                }).then(() => viewProfile(empId));
            }
        }

        function renderBirthdays() {
            const dashList = document.getElementById('dash-birthdays-list');
            const container = document.getElementById('birthdaysContainer');
            const currentMonth = new Date().getMonth() + 1;

            const bdays = employees.map(e => {
                const d = new Date(e.birthDate);
                return { ...e, month: d.getMonth() + 1, day: d.getDate() };
            }).sort((a,b) => a.day - b.day);

            const thisMonth = bdays.filter(e => e.month === currentMonth);
            document.getElementById('stat-bd-count').innerText = thisMonth.length;

            dashList.innerHTML = thisMonth.map(e => `
                <div class="p-4 bg-pink-50 rounded-2xl border border-pink-100 flex justify-between items-center">
                    <div class="flex items-center gap-3">
                        <span class="text-xl">🎂</span>
                        <div>
                            <p class="text-xs font-black">${e.name}</p>
                            <p class="text-[10px] font-bold text-pink-500">${e.day} / ${e.month}</p>
                        </div>
                    </div>
                    <span class="text-[9px] font-black bg-white px-2 py-1 rounded-lg text-pink-600 shadow-sm">قريباً</span>
                </div>
            `).join('');

            container.innerHTML = bdays.map(e => `
                <div class="bg-white p-6 rounded-3xl border text-center hover:shadow-lg transition-all">
                    <div class="w-12 h-12 bg-pink-50 text-pink-500 rounded-full mx-auto flex items-center justify-center text-xl mb-3">🎉</div>
                    <h5 class="text-xs font-black mb-1">${e.name}</h5>
                    <p class="text-[10px] font-bold text-slate-400">${e.day} / ${e.month}</p>
                    <div class="mt-3 text-[9px] bg-slate-50 px-2 py-1 rounded-full inline-block font-bold">${e.dept}</div>
                </div>
            `).join('');
        }

        function updateStats() {
            document.getElementById('stat-emp-count').innerText = employees.length;
        }

        window.onload = initSync;
    </script>
</body>
</html>
