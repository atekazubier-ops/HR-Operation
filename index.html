<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Larkon Dashboard - Firebase</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        /* 1. إعداد المتغيرات والألوان الأساسية (نفس ألوان الصورة) */
        :root {
            --sidebar-bg: #1a1e2b;       /* لون القائمة الجانبية الداكن */
            --body-bg: #f5f6fa;          /* لون الخلفية الرمادي الفاتح */
            --primary-orange: #ff6b4a;   /* لون البرتقالي المميز في الصورة */
            --white: #ffffff;
            --text-dark: #313a46;
            --text-muted: #98a6ad;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            display: flex;
            height: 100vh;
            background-color: var(--body-bg);
            color: var(--text-dark);
        }

        /* 2. تنسيق القائمة الجانبية (Sidebar) */
        .sidebar {
            width: 250px;
            background-color: var(--sidebar-bg);
            color: white;
            display: flex;
            flex-direction: column;
            padding: 20px 0;
            box-shadow: 2px 0 10px rgba(0,0,0,0.1);
        }

        .logo {
            padding: 0 20px 30px;
            font-size: 24px;
            font-weight: bold;
            color: var(--white);
            display: flex;
            align-items: center;
        }

        .logo i { color: var(--primary-orange); margin-left: 10px; }

        .nav-link {
            padding: 12px 20px;
            color: var(--text-muted);
            text-decoration: none;
            display: flex;
            align-items: center;
            transition: 0.3s;
        }

        .nav-link:hover, .nav-link.active {
            background-color: #252b3b;
            color: var(--white);
            border-right: 3px solid var(--primary-orange);
        }

        .nav-link i { margin-left: 12px; width: 20px; text-align: center; }

        /* 3. تنسيق المحتوى الرئيسي */
        .main-content {
            flex: 1;
            overflow-y: auto;
            padding: 25px;
        }

        /* 4. تنسيق بطاقات الإحصائيات (Stats Cards) */
        .stats-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: var(--white);
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            display: flex;
            flex-direction: column;
        }

        .stat-card h3 { 
            margin: 0; 
            font-size: 14px; 
            color: var(--text-muted); 
            text-transform: uppercase;
        }

        .stat-card .value { 
            font-size: 24px; 
            font-weight: bold; 
            margin: 10px 0; 
        }

        .stat-card .trend { font-size: 12px; font-weight: 500; }
        .trend-up { color: #0acf97; } /* لون أخضر للنمو */

        /* 5. تنسيق النموذج والجدول */
        .data-section {
            background: var(--white);
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        .form-group { margin-bottom: 20px; }

        input {
            padding: 10px;
            width: 250px;
            border: 1px solid #dee2e6;
            border-radius: 5px;
            outline: none;
        }

        button {
            background-color: var(--primary-orange);
            color: white;
            border: none;
            padding: 10px 25px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
        }
